board:
  name: acdb
  vendor: sekigon
  socs:
    - name: nrf52840
  # The revisions follow usu-aoba's (sekigon-gonnoc/usu-aoba), which this board
  # is: 0.0.0 = usu-aoba rev.0 (the "ACDB" prototype), 1.0.0 = usu-aoba rev.1.
  # The 20-pin connector is the same on both; the extension connector and the
  # battery pin are not -- see acdb_<revision>.overlay. A bare "acdb" builds
  # rev.1. A build for one revision does not work on the other: the trackpad
  # is on different pins.
  revision:
    format: major.minor.patch
    default: 1.0.0
    revisions:
      - name: 0.0.0
      - name: 1.0.0
