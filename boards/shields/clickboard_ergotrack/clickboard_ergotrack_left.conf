CONFIG_I2C=y
CONFIG_INPUT_IQS9151=y
CONFIG_ZMK_POINTING=y

CONFIG_ZMK_NON_LIPO_MAX_MV=3000
CONFIG_ZMK_NON_LIPO_MIN_MV=2000
CONFIG_ZMK_NON_LIPO_LOW_MV=2000

# --- Custom Studio Protocol: diagnostics (peripheral half) ---
# Each half detects and stores its own watchdog incidents, and the kscan
# relay needs a matching event data length on both halves. The peripheral
# needs no CONFIG_ZMK_STUDIO of its own -- the central forwards the queries.
CONFIG_ZMK_WATCHDOG=y

CONFIG_ZMK_KSCAN_DIAGNOSTICS=y
CONFIG_ZMK_KSCAN_DIAGNOSTICS_SPLIT=y
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=256

CONFIG_INPUT_IQS9151_DYNAMIC_FILTER_BOTTOM_SPEED=10
CONFIG_INPUT_IQS9151_DYNAMIC_FILTER_BOTTOM_BETA=100
CONFIG_INPUT_IQS9151_CURSOR_INERTIA_ENABLE=n
CONFIG_INPUT_IQS9151_SCROLL_INERTIA_ENABLE=n

# 左パッドのタッチ状態を右手側へ通知する(両手連携モード用)
CONFIG_INPUT_IQS9151_TOUCH_STATE_ENABLE=y

# ICの解像度。パッチ適用後はこの値が実際に書き込まれるため、Kconfigの既定値
# (2457/3072)ではなく本来のハード値を明示しておく。倍率はmacOS側で調整
CONFIG_INPUT_IQS9151_RESOLUTION_X=1300
CONFIG_INPUT_IQS9151_RESOLUTION_Y=1200
