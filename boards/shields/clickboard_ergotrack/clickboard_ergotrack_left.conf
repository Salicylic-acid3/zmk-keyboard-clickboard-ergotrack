CONFIG_I2C=y
CONFIG_INPUT_IQS9151=y
CONFIG_ZMK_POINTING=y

# 電池ゲージ。いまの目盛りは信用できない: 新品の CR2032 x2 (並列・約3.0V) で
# ずっと 1% を指しており、ADC が拾っている電圧が約2.01Vということになる。
# モジュール側は分圧を一切補正せず、ピンの電圧をそのまま電池電圧として扱う
# (binding に output-ohms / full-ohms が無い)。基板側の分圧比が分かるまで
# MIN/MAX は暫定。
CONFIG_ZMK_NON_LIPO_MAX_MV=3000
CONFIG_ZMK_NON_LIPO_MIN_MV=2000

# ここが危険だった。LOW_MV 以下を読むと、モジュールは sys_poweroff() で
# 半身ごと電源を落とす (USB給電中だけ見送る)。それが 2000 = MIN_MV = 実測値
# だったので、電池駆動のときは常に電源断の一歩手前にいた。
# 「左にUSBを挿すとパッドが生き返る」のはこれで説明がつく。
# 目盛りが直るまでは発動しない値にしておく。
CONFIG_ZMK_NON_LIPO_LOW_MV=1200

# --- Custom Studio Protocol: diagnostics (peripheral half) ---
# Each half detects and stores its own watchdog incidents, and the kscan
# relay needs a matching event data length on both halves. The peripheral
# needs no CONFIG_ZMK_STUDIO of its own -- the central forwards the queries.
CONFIG_ZMK_WATCHDOG=y

CONFIG_ZMK_KSCAN_DIAGNOSTICS=y
CONFIG_ZMK_KSCAN_DIAGNOSTICS_SPLIT=y
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=256

CONFIG_INPUT_IQS9151_DYNAMIC_FILTER_BOTTOM_SPEED=10
CONFIG_INPUT_IQS9151_DYNAMIC_FILTER_BOTTOM_BETA=100
CONFIG_INPUT_IQS9151_CURSOR_INERTIA_ENABLE=n
CONFIG_INPUT_IQS9151_SCROLL_INERTIA_ENABLE=n

# 左パッドのタッチ状態を右手側へ通知する(両手連携モード用)
CONFIG_INPUT_IQS9151_TOUCH_STATE_ENABLE=y

# --- ICの解像度: パッドの辺の比に合わせる ---
# 電極層の実寸は **85.7 x 52.1 mm**(Gerberの内層から実測)。センサのX軸が
# 長辺=画面の縦、Y軸が短辺=画面の横。
#
# 1300/1200 はICの初期値そのままで、**長辺にも短辺とほぼ同じカウントしか
# 割り当てていない**。結果:
#   縦 1300/85.7 = 15.2 カウント/mm
#   横 1200/52.1 = 23.0 カウント/mm   → 横が 1.52倍 速い
# 「同じだけ指を動かしても縦だけポインタが進まない」の正体がこれ。
#
# 効くのはカーソルだけではない。このドライバの軸の判定は**全部カウントの
# 比較**(スクロールがどちらの軸か・スワイプがどちらに勝ったか・指の開きが
# 重心移動に勝ったか)なので、カウント/mm がずれていると判定そのものが
# 密なほうへ 1.5倍傾く。しきい値をいくらいじっても直らない。
#
# 短辺の 1200 を基準に、長辺を辺の比で伸ばす: 1200 x 85.7/52.1 = 1974。
# これで計算上は両軸とも 23.0 カウント/mm になる。
# 縦のカーソル速度が 1.52倍になるので、全体の速さはアプリ側で取り直すこと。
#
# **ただし実測はこの計算と合わなかった。** 実際に指を動かしてカウントを数えると、
# 横が縦の2倍以上細かいままだった。図面から読めるのは銅箔の外形であって
# **電極アレイそのものではない**ので、辺の比が計算どおりとは限らない。
# なので下の2行は**アプリから動かせる設定の既定値**になっている
# (keebon__trackpad の resolution_x / resolution_y)。
# 正解は焼き直しではなく、トラックパッドタブで数字を振って指で決めること。
# 決めた値はキーボード側に保存される。
CONFIG_INPUT_IQS9151_RESOLUTION_X=1974
CONFIG_INPUT_IQS9151_RESOLUTION_Y=1200

# --- スタック: リレーイベント肥大化への対応 ---
# CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=256 にしたことで
# struct zmk_split_transport_peripheral_event が約260バイトに膨らんでいる。
# この構造体は split の受け渡しで値渡し・ローカル変数として積まれるため、
# ペリフェラルからイベントが飛ぶたびにスタックを大きく消費する。
CONFIG_BT_RX_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_INPUT_THREAD_STACK_SIZE=2048

# **ここが抜けていた。アプリに接続した瞬間に左半身が落ちる原因。**
#
# 上の4本を上げたとき、**セントラルへ通知を飛ばすスレッド自体**を忘れていた。
# ZMK の split サービス(ペリフェラル側)は専用のワークキューを持っていて、
# 既定のスタックは **756バイト**:
#   K_THREAD_STACK_DEFINE(service_q_stack, CONFIG_ZMK_SPLIT_BLE_PERIPHERAL_STACK_SIZE)
#
# リレーの**応答**はここから出る:
#   zmk_split_bt_send_relay_event()
#     → k_work_submit_to_queue(&service_work_q, &service_relay_event_notify_work)
#       → send_relay_event_callback()
#         → split_svc_notify_relay_event_chunks()
#           → bt_gatt_notify()  ← ATT PDU の組み立て、net_buf の確保、属性表の走査
#
# このキューは元々、数バイトのキー位置イベントとセンサーイベントしか送っていなかった。
# 756バイトはそれには足りていた。v0.7.4 でリレーを載せてから、同じスレッドが
# 260バイトのペイロードを bt_gatt_notify に通すようになり、足りなくなった。
#
# 症状が「アプリで接続した瞬間」なのはそのため。アプリは接続直後に設定一覧を
# 取りに行き、セントラルがそれを左へリレーし、**左が返事を書こうとして溢れる**。
# HW_STACK_PROTECTION が効いているのでそこで止まる = 左半身が再起動する。
#
# v0.7.5 で入れた ZMK_LOW_PRIORITY_THREAD_STACK_SIZE は**要求を解く側**のスタックで、
# あれも必要だが、**返事を出す側**はこちら。2本とも要る。
CONFIG_ZMK_SPLIT_BLE_PERIPHERAL_STACK_SIZE=2048

# --- クラッシュ解析用: スレッド名とMPUによるスタック保護 ---
# 破損したPCで飛ぶ代わりに「どのスレッドが溢れたか」で止まるようになる。
CONFIG_THREAD_NAME=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_HW_STACK_PROTECTION=y

# --- スワイプの向き(2本指・3本指とも) ---
# スワイプの判定はドライバの中で、センサ自身の座標で行われる。ジェスチャ全体に
# ついての1回の判断なので、そこで決めるのが正しい。ただし listener の
# zip_xy_transform (XY_SWAP / X_INVERT / Y_INVERT) はその判定を通らないため、
# 「カーソルは正しく動くのにスワイプだけ逆」という状態になる。
# 左パッドは右パッドと同じ部品を180度回して載せているので、両軸とも反転する。
# 右に合わせる = 左だけ反転させる。
CONFIG_INPUT_IQS9151_SWIPE_INVERT_X=y
CONFIG_INPUT_IQS9151_SWIPE_INVERT_Y=y

# --- 2本指の横スワイプ(戻る/進むなどに割り当て) ---
# 横方向に「はっきり」動かしたときだけ1回のキーとして飛ぶ。キーマップの
# pos79 / pos80 に届くので、中身はアプリから自由に変えられる。
# 引き換えに2本指の横スクロールは出せなくなる。ジェスチャーとして認識するには
# 最後まで見届ける必要があり、その間スクロールを始められないため。
# 縦スクロールには影響しない。
CONFIG_INPUT_IQS9151_2F_SWIPE_ENABLE=y

# --- 3本指スワイプ: 横だけしきい値を下げる ---
# 「3本指の横スワイプが明らかに難しい」への対応。
# パッドは 85.7 x 52.1 mm の縦長で、画面の横 = センサのY軸 = **短辺**。
# 3本の指はその短辺に並ぶので、指自体で 40mm 近く占めてしまい、残りが
# ほとんど無い。縦(長辺85.7mm)には余裕があるので、同じ 200 カウント
# (解像度をそろえた今は 8.7mm)でも難しさがまるで違う。
# 横だけ 140 カウント = 6.1mm に下げて釣り合わせる。
# 縦(X)は 200 のまま。ここを下げると縦スクロールと喧嘩する。
CONFIG_INPUT_IQS9151_3F_SWIPE_THRESHOLD_Y=140

# --- 2本指スクロールとピンチの取り違え対策 ---
# 「丁寧に上下すると速いが、雑にやるとピンチになる」への対応。
# 指の間隔の変化が重心の移動より大きいだけでピンチに倒れていたのを、
# 2倍以上でないとピンチにしない、に変えた。雑な上下では指が少し開くので、
# 「大きいだけ」では足りない。開始距離のほうを上げると、意図したピンチまで
# 大きく開かないと始まらなくなるので、そちらは触らない。
CONFIG_INPUT_IQS9151_2F_PINCH_DOMINANCE_X10=20

# --- 斜めに伸ばした指でも「上下スクロール」として扱う ---
# ErgoTrack のパッドには2通りの触り方がある: 正面から真っ直ぐ触る場合と、
# ホームポジションから斜めに指を伸ばす場合。後者では手首の角度のぶん、
# 本人が「真上」に動かしてもパッドから見れば斜めになる。そのままだと
# 縦に流れながら横にも少しずつずれていき、狙ったところで止まらない。
#
# スクロールが始まった**その一瞬**に、勝っている軸を見て以後その軸だけを
# 出す。12 = 「相手の1.2倍」で、真っ直ぐから約40度までが「その軸」。
# それより斜めなら両軸とも通す(本当に斜めに動かしたとき用)。
# 判定はカウントの比較なので、上の解像度あわせ(RESOLUTION_X)が前提。
CONFIG_INPUT_IQS9151_2F_SCROLL_AXIS_LOCK_X10=12

# --- 片手ピンチ(2本指ズーム)— アプリから切り替えられる ---
# 「使うかどうか」も「どちら向きか」も基板の性質ではなく持ち主の好みなので、
# カスタム設定として公開してある(CONFIG_INPUT_IQS9151_RUNTIME_SETTINGS)。
# 下の2行はその**既定値**。触っていないキーボードはこの通りに振る舞う。
#
# 既定はオフ。2本指スクロールと誤爆するうえ、両手ピンチ(dual-pad の zoom)で
# 同じことができるため、このパッドのサイズでは邪魔にしかならなかった。
# もっと大きいパッドを積んだモデルなら既定をオンにすればいい。
CONFIG_INPUT_IQS9151_2F_PINCH_ENABLE=n
# 向きはホストの流儀で決まるもので、macOS では既定が逆に感じられたので反転。
CONFIG_INPUT_IQS9151_2F_PINCH_INVERT=y

# ジェスチャーの判定は**センサーを持っている側**で行われるので、設定も
# 左右それぞれが自分のコピーを読む。左にも入れないと左パッドだけ古い設定で
# 動き続ける。アプリは「全ての側へ」書くので、リレーも要る。
CONFIG_ZMK_CUSTOM_SETTINGS=y
CONFIG_ZMK_CUSTOM_SETTINGS_SPLIT_RPC_RELAY=y
CONFIG_INPUT_IQS9151_RUNTIME_SETTINGS=y

# **リレーを受ける側にもスタックが要る。** カスタム設定は
# ZMK_LOW_PRIORITY_WORK_QUEUE を select し、リレーされてきた要求も応答も
# そのキューの上で protobuf を解く。ZMK の既定は **768バイト** で、
# それでは足りない。
#
# 右手側には最初からこの行があり、「これが無いとアプリの一覧更新でMPUの
# スタックガードに当たって落ちる」と書いてある。v0.7.4 で左に
# ZMK_CUSTOM_SETTINGS を載せたとき、この1行だけ持ってこなかった。
# 症状は「アプリで接続した瞬間にキーボードが再起動する」。
# HW_STACK_PROTECTION が効いているので、壊れたPCで飛ぶ代わりにそこで止まる。
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=2048
# listener の zip_scroll_transform XY_SWAP はホイールイベント全部に効くので、
# ピンチの縦ホイールが横スクロールに化けてズームしない。横で出して打ち消す。
CONFIG_INPUT_IQS9151_2F_PINCH_WHEEL_HORIZONTAL=y
# ホイールは zip_scroll_scaler 1 16 で1/16されるので、そのぶんゲインを上げる。
CONFIG_INPUT_IQS9151_2F_PINCH_WHEEL_GAIN_X10=100

# --- USB 識別子 ---
# Kconfig.defconfig ではなくここに置いてある。あちらが与えられるのは Kconfig の
# "default" で、同じ記号に default が複数あると **最初に読まれたもの** が勝つ。
# ZMK は app/Kconfig で自分の既定値(VID 0x1D50 / PID 0x615E / "ZMK Project")を
# 先に宣言しているので、シールドの Kconfig.defconfig に書いても一度も効かない。
# 実際 ioreg では 0x1D50 / "ZMK Project" のまま出ていた。
# .conf の代入は default ではなく設定そのものなので、確実に勝つ。
#
# VID 0x355D は使用許諾を得て使用(登録は moimate inc.)。PID はキーボードごと。
# 採番表は進捗ログに。**VID はアプリの接続判定そのもの**で、これが 0x355D で
# ないと Keeb-On! Studio のポート選択に出てこない。
CONFIG_USB_DEVICE_VID=0x355D
CONFIG_USB_DEVICE_PID=0x1028
CONFIG_USB_DEVICE_MANUFACTURER="Keeb-On!"
CONFIG_USB_DEVICE_PRODUCT="ClickBoard ErgoTrack"
