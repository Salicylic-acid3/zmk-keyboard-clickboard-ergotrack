CONFIG_I2C=y
CONFIG_INPUT_IQS9151=y
CONFIG_ZMK_POINTING=y

CONFIG_ZMK_NON_LIPO_MAX_MV=3000
CONFIG_ZMK_NON_LIPO_MIN_MV=2000
CONFIG_ZMK_NON_LIPO_LOW_MV=2000

CONFIG_ZMK_STUDIO=y
# Studio のロック。無効にすると、接続したブラウザが無条件に書き込める代わりに
# BLE から Studio に繋げなくなる: キーボードは接続中アドバタイズを止めるので、
# ブラウザのデバイス選択に出てこない。それを回避する
# ZMK_STUDIO_LOCK_BLE_DIRECT_ADVERTISING_ON_UNLOCK は
# 「default y if ZMK_STUDIO_LOCKING」で、しかもフラグを立てるのは
# アンロックの瞬間だけなので、ロックが無いと一度も立たない。
# → 無線で使うならロックは必須。解除キーは Drag レイヤーの Del の位置
#   (右手側の一番右上)。左クリックのキーを押しながらそこを押す。
CONFIG_ZMK_STUDIO_LOCKING=y
# 接続中もアドバタイズを続ける。Kconfig の default は
# 「y if ZMK_STUDIO_LOCKING && ZMK_BLE」なので上の行でもう有効だが、
# BLE から繋がるかどうかがこの1行に懸かっているので明示しておく。
CONFIG_ZMK_STUDIO_LOCK_BLE_DIRECT_ADVERTISING_ON_UNLOCK=y
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=192
CONFIG_ZMK_STUDIO_RPC_CUSTOM_SUBSYSTEM_REQUEST_PAYLOAD_MAX_BYTES=192
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=2048

# --- Custom Studio Protocol: connection management ---
# (Keeb-On! Studio's Connection tab: BLE profile naming/switching/unpairing,
# per-connection and per-OS default layers.)
CONFIG_ZMK_CUSTOM_SETTINGS=y
CONFIG_ZMK_CUSTOM_SETTINGS_STUDIO_RPC=y

CONFIG_ZMK_BLE_MANAGEMENT=y
CONFIG_ZMK_BLE_MANAGEMENT_STUDIO_RPC=y

CONFIG_ZMK_OS_DETECTION=y
CONFIG_ZMK_OS_DETECTION_USB=y
CONFIG_ZMK_OS_DETECTION_BLE=y
CONFIG_ZMK_OS_DETECTION_STUDIO_RPC=y

CONFIG_ZMK_DEFAULT_LAYER=y
CONFIG_ZMK_DEFAULT_LAYER_MAX_INDEX=1
CONFIG_ZMK_DEFAULT_LAYER_STUDIO_RPC=y
CONFIG_ZMK_DEFAULT_LAYER_OS_DETECTION=y

# --- Custom Studio Protocol: macro & combo runtime editing ---
# (Keeb-On! Studio's Macro&Combo tab.)
CONFIG_ZMK_RUNTIME_MACRO=y
CONFIG_ZMK_RUNTIME_MACRO_STUDIO_RPC=y
CONFIG_ZMK_BEHAVIOR_LOCAL_ID_TYPE_CRC16=y
CONFIG_ZMK_CUSTOM_SETTINGS_LARGE_VALUE_MAX_SIZE=256

CONFIG_ZMK_RUNTIME_COMBO=y
CONFIG_ZMK_RUNTIME_COMBO_STUDIO_RPC=y

# --- Custom Studio Protocol: diagnostics & device settings ---
# (Keeb-On! Studio's Troubleshooting and Settings tabs.)
CONFIG_ZMK_DEVICE_INFO=y
CONFIG_ZMK_DEVICE_INFO_STUDIO_RPC=y

CONFIG_ZMK_WATCHDOG=y
CONFIG_ZMK_WATCHDOG_STUDIO_RPC=y

CONFIG_ZMK_KSCAN_DIAGNOSTICS=y
CONFIG_ZMK_KSCAN_DIAGNOSTICS_STUDIO_RPC=y
CONFIG_ZMK_KSCAN_DIAGNOSTICS_SPLIT=y
# Required on BOTH halves: a peripheral reply carries a full topology page,
# which is larger than ZMK's default relay payload.
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=256

# Live key-press view during the kscan test (and in the keymap editor).
CONFIG_ZMK_INPUT_STREAM_FEATURE=y
CONFIG_ZMK_INPUT_STREAM_FEATURE_STUDIO_RPC=y

CONFIG_ZMK_SETTINGS_RPC=y
CONFIG_ZMK_SETTINGS_RPC_STUDIO=y

# --- キーマップの高速読み込み ---
# 読み取り専用。フィンガープリントで差分だけ取るので、BLE接続時の
# キーマップ表示が速くなる。編集・保存は従来どおり公式プロトコル。
# 要求サイズは小さく、RX_BUF は上で192にしてあるので追加調整は不要。
CONFIG_ZMK_FAST_KEYMAP=y
CONFIG_ZMK_FAST_KEYMAP_STUDIO_RPC=y

# --- キー以外の部品(トラックパッド)の位置 ---
# 公式プロトコルはキーしか送らないので、パッドの位置はこのモジュールが送る。
# ノード定義は clickboard_ergotrack_right.overlay の末尾。
CONFIG_ZMK_PHYSICAL_LAYOUTS_FEATURE=y
CONFIG_ZMK_PHYSICAL_LAYOUTS_FEATURE_STUDIO_RPC=y

# --- トラックパッドのランタイム調整 ---
# 基準の感度をアプリから設定する。キーに割り当ててある zip_dyn_scale は
# その場での微調整として残してあるので、両者は掛け算になる。
# CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=2048 が必須(上で設定済み)。
# これが無いとアプリの「一覧を更新」でMPUのスタックガードに当たって落ちる。
# 共有スレッドのスタックはモジュール側からは広げられないので、ここで指定する。
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR=y
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR_STUDIO_RPC=y
# processor-label の既定は7文字まで(NUL込み8)。"mouse (alt)" のような
# 読める名前を付けたいので広げる。名前はRPCで送られるだけでなく
# 保存済み設定のキーでもあるので、一度決めた名前は変えないこと。
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR_NAME_MAX_LEN=16

# Diagnostics responses are large; a bigger TX buffer transfers them with
# fewer stalls.
CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=256

CONFIG_INPUT_IQS9151_DYNAMIC_FILTER_BOTTOM_SPEED=10
CONFIG_INPUT_IQS9151_DYNAMIC_FILTER_BOTTOM_BETA=100
CONFIG_INPUT_IQS9151_CURSOR_INERTIA_ENABLE=n
CONFIG_INPUT_IQS9151_SCROLL_INERTIA_ENABLE=n
# ICの解像度。パッチ適用後はこの値が実際に書き込まれるため、Kconfigの既定値
# (2457/3072)ではなく本来のハード値を明示しておく。倍率はmacOS側で調整
CONFIG_INPUT_IQS9151_RESOLUTION_X=1300
CONFIG_INPUT_IQS9151_RESOLUTION_Y=1200

# --- スタック: リレーイベント肥大化への対応 ---
# CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=256 にしたことで
# struct zmk_split_transport_peripheral_event が約260バイトに膨らんでいる。
# この構造体は split の受け渡しで値渡し・ローカル変数として積まれるため、
# ペリフェラルからイベントが飛ぶたびにスタックを大きく消費する。
CONFIG_BT_RX_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_INPUT_THREAD_STACK_SIZE=2048

# --- クラッシュ解析用: スレッド名とMPUによるスタック保護 ---
# 破損したPCで飛ぶ代わりに「どのスレッドが溢れたか」で止まるようになる。
CONFIG_THREAD_NAME=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_HW_STACK_PROTECTION=y

# --- ピンチ(ズーム)---
# listener の zip_scroll_transform XY_SWAP はホイールイベント全部に効くので、
# ピンチの縦ホイールが横スクロールに化けてズームしない。横で出して打ち消す。
CONFIG_INPUT_IQS9151_2F_PINCH_WHEEL_HORIZONTAL=y
# ホイールは zip_scroll_scaler 1 16 で1/16されるので、そのぶんゲインを上げる。
CONFIG_INPUT_IQS9151_2F_PINCH_WHEEL_GAIN_X10=100

# 右パッドのタッチ状態。dual_pad が「左右とも1本ずつ触れている」を判定するのに
# 両側の状態が要る。
CONFIG_INPUT_IQS9151_TOUCH_STATE_ENABLE=y

# --- タップダンス（アプリから編集可能） ---
# タップ回数ごとの割り当てと判定時間を settings に置く。スロットは最初は
# 空で、アプリで設定するまで押しても何も起きない。
CONFIG_ZMK_RUNTIME_TAP_DANCE=y
CONFIG_ZMK_RUNTIME_TAP_DANCE_COUNT=4
CONFIG_ZMK_RUNTIME_TAP_DANCE_MAX_TAPS=3

# --- 電池残量の報告 ---
# 左右それぞれの残量をカスタム設定として公開する。ZMK本体の報告は
# BLEのBattery Service経由なので、USBで繋いでいるアプリからは見えない。
CONFIG_ZMK_BATTERY_REPORT=y
# セントラルが相方の残量を取り寄せる。これが無いと左手側の値は存在しない。
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
# 残量はTEMPORARYモードで書く(フラッシュに触らない・未保存扱いにもならない)。
# そのスロットを2つ占有し続けるので、既定の2のままだと他が使えなくなる。
CONFIG_ZMK_CUSTOM_SETTINGS_TEMP_SLOTS=4
