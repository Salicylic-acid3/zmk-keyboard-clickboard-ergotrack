CONFIG_I2C=y
CONFIG_INPUT_IQS9151=y
CONFIG_ZMK_POINTING=y

CONFIG_ZMK_NON_LIPO_MAX_MV=3000
CONFIG_ZMK_NON_LIPO_MIN_MV=2000
CONFIG_ZMK_NON_LIPO_LOW_MV=2000

CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=128
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=2048

# --- Custom Studio Protocol: connection management ---
# (Keeb-On! Studio's Connection tab: BLE profile naming/switching/unpairing,
# per-connection and per-OS default layers.)
CONFIG_ZMK_CUSTOM_SETTINGS=y
CONFIG_ZMK_CUSTOM_SETTINGS_STUDIO_RPC=y

CONFIG_ZMK_BLE_MANAGEMENT=y
CONFIG_ZMK_BLE_MANAGEMENT_STUDIO_RPC=y

CONFIG_ZMK_OS_DETECTION=y
CONFIG_ZMK_OS_DETECTION_USB=y
CONFIG_ZMK_OS_DETECTION_BLE=y
CONFIG_ZMK_OS_DETECTION_STUDIO_RPC=y

CONFIG_ZMK_DEFAULT_LAYER=y
CONFIG_ZMK_DEFAULT_LAYER_MAX_INDEX=1
CONFIG_ZMK_DEFAULT_LAYER_STUDIO_RPC=y
CONFIG_ZMK_DEFAULT_LAYER_OS_DETECTION=y

CONFIG_INPUT_IQS9151_DYNAMIC_FILTER_BOTTOM_SPEED=10
CONFIG_INPUT_IQS9151_DYNAMIC_FILTER_BOTTOM_BETA=100
CONFIG_INPUT_IQS9151_CURSOR_INERTIA_ENABLE=n
CONFIG_INPUT_IQS9151_SCROLL_INERTIA_ENABLE=n
# ICの解像度。パッチ適用後はこの値が実際に書き込まれるため、Kconfigの既定値
# (2457/3072)ではなく本来のハード値を明示しておく。倍率はmacOS側で調整
CONFIG_INPUT_IQS9151_RESOLUTION_X=1300
CONFIG_INPUT_IQS9151_RESOLUTION_Y=1200
