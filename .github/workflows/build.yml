name: Build ZMK firmware
on: [push, pull_request, workflow_dispatch]

# This used to be a one-line call to
# zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3. That workflow
# copies only zmk.uf2 out of the build directory, and it takes no input that
# would change that, so keeping the ELF meant either patching upstream or
# building a second time.
#
# A second build is the wrong answer here: config/west.yml tracks moving
# branches (zmk main+dya, the patched Zephyr, the cormoran feature modules), so
# two builds started minutes apart can pull different commits. An ELF that does
# not match the .uf2 that is actually flashed resolves crash addresses to the
# wrong functions, which is worse than having no ELF at all.
#
# So the reusable workflow's build job is inlined below, unchanged except for
# the "Collect artifacts" step, which keeps zmk.elf and zmk.map next to the
# .uf2 from the same build. Upstream fixes to build-user-config.yml no longer
# arrive automatically; re-diff against
# https://github.com/zmkfirmware/zmk/blob/v0.3/.github/workflows/build-user-config.yml
# when bumping the ZMK version.

jobs:
  matrix:
    runs-on: ubuntu-22.04
    name: Fetch Build Keyboards
    outputs:
      build_matrix: ${{ env.build_matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Build Matrix
        run: |
          echo "build_matrix=$(yq -oj -I0 'build.yaml')" >> $GITHUB_ENV
          yq -oj 'build.yaml'

  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    needs: matrix
    name: Build
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.build_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create build directory
        run: |
          echo "build_dir=$(mktemp -d)" >> $GITHUB_ENV

      - name: Prepare variables
        shell: sh -x {0}
        env:
          board: ${{ matrix.board }}
          shield: ${{ matrix.shield }}
          artifact_name: ${{ matrix.artifact-name }}
          snippet: ${{ matrix.snippet }}
        run: |
          if [ -e zephyr/module.yml ]; then
            export zmk_load_arg=" -DZMK_EXTRA_MODULES='${GITHUB_WORKSPACE}'"
            new_tmp_dir="${TMPDIR:-/tmp}/zmk-config"
            mkdir -p "${new_tmp_dir}"
            echo "base_dir=${new_tmp_dir}" >> $GITHUB_ENV
          else
            echo "base_dir=${GITHUB_WORKSPACE}" >> $GITHUB_ENV
          fi

          if [ -n "${snippet}" ]; then
            extra_west_args="-S \"${snippet}\""
          fi

          echo "zephyr_version=${ZEPHYR_VERSION}" >> $GITHUB_ENV
          echo "extra_west_args=${extra_west_args}" >> $GITHUB_ENV
          echo "extra_cmake_args=${shield:+-DSHIELD=\"$shield\"}${zmk_load_arg}" >> $GITHUB_ENV
          echo "display_name=${shield:+$shield - }${board}" >> $GITHUB_ENV
          echo "artifact_name=${artifact_name:-${shield:+$shield-}${board}-zmk}" >> $GITHUB_ENV

      - name: Copy config files to isolated temporary directory
        run: |
          if [ "${{ env.base_dir }}" != "${GITHUB_WORKSPACE}" ]; then
            mkdir "${{ env.base_dir }}/config"
            cp -R config/* "${{ env.base_dir }}/config/"
          fi

      - name: Cache west modules
        uses: actions/cache@v4
        continue-on-error: true
        env:
          cache_name: cache-zephyr-${{ env.zephyr_version }}-modules
        with:
          path: |
            ${{ env.base_dir }}/modules/
            ${{ env.base_dir }}/tools/
            ${{ env.base_dir }}/zephyr/
            ${{ env.base_dir }}/bootloader/
            ${{ env.base_dir }}/zmk/
          key: ${{ runner.os }}-build-${{ env.cache_name }}-${{ hashFiles('**/west.yml', '**/build.yaml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache_name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: West Init
        working-directory: ${{ env.base_dir }}
        run: west init -l "${{ env.base_dir }}/config"

      - name: West Update
        working-directory: ${{ env.base_dir }}
        run: west update --fetch-opt=--filter=tree:0

      - name: West Zephyr export
        working-directory: ${{ env.base_dir }}
        run: west zephyr-export

      - name: West Build (${{ env.display_name }})
        working-directory: ${{ env.base_dir }}
        shell: sh -x {0}
        run: west build -s zmk/app -d "${{ env.build_dir }}" -b "${{ matrix.board }}" ${{ env.extra_west_args }} -- -DZMK_CONFIG=${{ env.base_dir }}/config ${{ env.extra_cmake_args }} ${{ matrix.cmake-args }}

      - name: ${{ env.display_name }} Kconfig file
        run: |
          if [ -f "${{ env.build_dir }}/zephyr/.config" ]
          then
            grep -v -e "^#" -e "^$" "${{ env.build_dir }}/zephyr/.config" | sort
          else
            echo "No Kconfig output"
          fi
        if: ${{ !cancelled() }}

      - name: ${{ env.display_name }} Devicetree file
        run: |
          if [ -f "${{ env.build_dir }}/zephyr/zephyr.dts" ]
          then
            cat "${{ env.build_dir }}/zephyr/zephyr.dts"
          elif [ -f "${{ env.build_dir }}/zephyr/zephyr.dts.pre" ]
          then
            cat -s "${{ env.build_dir }}/zephyr/zephyr.dts.pre"
          else
            echo "No Devicetree output"
          fi
        if: ${{ !cancelled() }}

      # Upstream copies only the .uf2 here. The .elf and .map ride along so a
      # crash log's PC/LR can be turned back into a function name months later:
      #   arm-none-eabi-addr2line -f -C -e clickboard_ergotrack_right.elf 0x0005193e
      # west-modules.txt records which commit of every moving branch went into
      # this exact binary.
      - name: Collect artifacts (${{ env.display_name }})
        shell: sh -x {0}
        working-directory: ${{ env.base_dir }}
        run: |
          mkdir "${{ env.build_dir }}/artifacts"
          for ext in uf2 bin hex elf map
          do
            for stem in zmk zephyr
            do
              if [ -f "${{ env.build_dir }}/zephyr/${stem}.${ext}" ]
              then
                cp "${{ env.build_dir }}/zephyr/${stem}.${ext}" \
                   "${{ env.build_dir }}/artifacts/${{ env.artifact_name }}.${ext}"
                break
              fi
            done
          done
          git config --global --add safe.directory '*'
          {
            west list -f '{name} {revision} {url}'
            echo
            west forall -c 'git rev-parse HEAD'
          } > "${{ env.build_dir }}/artifacts/${{ env.artifact_name }}.west-modules.txt" 2>&1 \
            || true
          ls -l "${{ env.build_dir }}/artifacts"

      - name: Archive (${{ env.display_name }})
        uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ env.artifact_name }}
          path: ${{ env.build_dir }}/artifacts

  merge:
    runs-on: ubuntu-latest
    needs: build
    name: Merge Output Artifacts
    steps:
      - name: Merge Artifacts
        uses: actions/upload-artifact/merge@v4
        with:
          name: firmware
          pattern: artifact-*
          delete-merged: true

  # Pushing a tag publishes the built .uf2 files as a GitHub Release.
  #
  # Keeb-On! Studio links to firmware with
  # /releases/latest/download/<name>.uf2, which is a stable permalink that
  # needs no login and always points at the newest release. Actions artifacts
  # cannot be used for that: they require a signed-in GitHub account and they
  # expire.
  #
  # Asset names come straight from the `artifact-name` values in build.yaml
  # (upstream only appends "-zmk" when artifact-name is absent), so they stay
  # identical release to release and the permalinks keep working.
  #
  # Only *.uf2 is published; the .elf/.map stay in the Actions artifact, where
  # they are useful for debugging but do not clutter the download page.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: merge
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the built firmware
        uses: actions/download-artifact@v4
        with:
          name: firmware
          path: firmware

      - name: List what will be published
        run: ls -l firmware

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This job never checks the repository out -- it only needs the
          # built artifact -- so gh has no git remote to infer the repository
          # from. Naming it here is cheaper than adding a checkout step.
          GH_REPO: ${{ github.repository }}
        run: |
          # Idempotent so a re-run of a failed release job doesn't error out.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" firmware/*.uf2 --clobber
          else
            gh release create "$GITHUB_REF_NAME" firmware/*.uf2 --generate-notes
          fi
